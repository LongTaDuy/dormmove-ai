services:
  backend:
    build:
      context: ./backend
    container_name: dormmove-backend
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: dormmove-frontend
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  # Optional Redis for LangGraph checkpointing. Enable by setting REDIS_URL.
  # redis:
  #   image: redis:7-alpine
  #   container_name: dormmove-redis
  #   ports:
  #     - "6379:6379"
